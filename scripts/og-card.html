<!doctype html>
<!--
  Source for the Open Graph cards in public/images/.
  Regenerate all variants with:  ./scripts/generate-og-card.sh

  Pick a variant with ?v=<name> (see VARIANTS below). Palette mirrors
  .gradient-bg / .gradient-text in src/app/globals.css.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Vendored so the render is deterministic and works offline. */
  @font-face{
    font-family:'Inter';
    src:url('assets/inter-latin.woff2') format('woff2');
    font-weight:100 900;
    font-style:normal;
    font-display:block;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body { width:1200px; height:630px; }

  body{
    font-family:'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background:#0a0812;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    position:relative;
    width:1200px; height:630px;
    background:linear-gradient(135deg,#0a0812 0%,#120f24 25%,#1a1233 50%,#1f0f2e 75%,#260d28 100%);
    overflow:hidden;
  }

  /* Ambient glows echoing the logo's violet + warm ends */
  .glow{ position:absolute; border-radius:50%; filter:blur(90px); }
  .glow-violet{
    width:760px; height:760px; top:-300px; right:-200px;
    background:radial-gradient(circle,rgba(167,139,250,.30) 0%,rgba(232,121,249,.12) 45%,transparent 70%);
  }
  .glow-warm{
    width:620px; height:620px; bottom:-320px; left:-160px;
    background:radial-gradient(circle,rgba(244,114,182,.20) 0%,rgba(249,115,22,.10) 45%,transparent 70%);
  }

  /* Fine grid, barely-there structure */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 40%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 40%,transparent 100%);
  }

  .hairline{
    position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg,#a78bfa 0%,#e879f9 38%,#f472b6 62%,#f97316 100%);
  }

  .domain{
    position:absolute; bottom:44px; right:86px;
    font-size:21px; font-weight:500; letter-spacing:.03em;
    color:rgba(255,255,255,.42);
  }

  .gradient{
    background:linear-gradient(135deg,#a78bfa 0%,#e879f9 50%,#f472b6 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
  }

  /* ---------- brand lockup (home layout) ---------- */
  .inner{
    position:relative; height:100%;
    display:flex; align-items:center; gap:64px;
    padding:0 86px;
  }
  .logo{
    width:268px; height:268px; flex-shrink:0; object-fit:contain;
    filter:drop-shadow(0 18px 55px rgba(139,92,246,.42));
  }
  .divider{
    width:1px; height:300px; flex-shrink:0;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.16) 22%,rgba(255,255,255,.16) 78%,transparent);
  }
  .copy{ display:flex; flex-direction:column; }
  .eyebrow{
    font-size:19px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase;
    color:#c4b5fd; margin-bottom:22px;
  }
  .wordmark{
    font-size:104px; font-weight:800;
    letter-spacing:-.035em; line-height:1;
    margin-bottom:26px;
  }
  .tagline{
    font-size:35px; font-weight:400; line-height:1.32;
    color:rgba(255,255,255,.80);
    letter-spacing:-.012em;
  }

  /* ---------- headline layout (interior pages) ---------- */
  .stack{
    position:relative; height:100%;
    display:flex; flex-direction:column; justify-content:flex-start;
    /* Top padding clears the absolutely-positioned brand lockup, so the
       kicker reads as a label for the headline rather than part of it. */
    padding:200px 86px 0;
  }
  .brand{
    position:absolute; top:66px; left:86px;
    display:flex; align-items:center; gap:16px;
  }
  .brand img{
    width:64px; height:64px; object-fit:contain;
    filter:drop-shadow(0 8px 24px rgba(139,92,246,.45));
  }
  .brand span{
    font-size:26px; font-weight:700; letter-spacing:-.02em;
    color:rgba(255,255,255,.92);
  }
  .kicker{
    font-size:19px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase;
    color:#c4b5fd; margin-bottom:26px;
  }
  .headline{
    font-size:64px; font-weight:800;
    letter-spacing:-.032em; line-height:1.14;
    color:#fff;
  }
  /* Two-line headlines get more size to fill the same block. */
  .headline.lg{ font-size:76px; }
  .headline .accent{ display:block; }
  .sub{
    margin-top:30px;
    font-size:29px; font-weight:400; line-height:1.4;
    color:rgba(255,255,255,.68);
    letter-spacing:-.01em;
    max-width:880px;
  }
</style>
</head>
<body>
  <div class="card" id="card"></div>

<script>
const VARIANTS = {
  // Site-wide card.
  'home': () => `
    <div class="inner">
      <img class="logo" src="../public/images/sv-icon.png" alt="">
      <div class="divider"></div>
      <div class="copy">
        <div class="eyebrow">Multi-Agent Deliberation</div>
        <h1 class="wordmark gradient">Superviber</h1>
        <p class="tagline">Coordinated intelligence<br>for complex decisions.</p>
      </div>
    </div>
    <div class="domain">superviber.com</div>`,

  // /alignment — leads with the page's own hero line.
  'alignment': () => `
    <div class="brand">
      <img src="../public/images/sv-icon.png" alt="">
      <span>Superviber</span>
    </div>
    <div class="stack">
      <div class="kicker">Alignment Dialogues</div>
      <h1 class="headline">
        N experts.<br>
        Structured disagreement.<br>
        <span class="accent gradient">Emergent truth.</span>
      </h1>
      <p class="sub">Watch multiple AI experts deliberate and converge on consensus.</p>
    </div>
    <div class="domain">superviber.com/alignment</div>`,

  // /alignment/demo — the worked NVIDIA example.
  'demo': () => `
    <div class="brand">
      <img src="../public/images/sv-icon.png" alt="">
      <span>Superviber</span>
    </div>
    <div class="stack">
      <div class="kicker">Alignment Dialogue Demo</div>
      <h1 class="headline">
        8 experts.<br>
        4 rounds.<br>
        <span class="accent gradient">One decision.</span>
      </h1>
      <p class="sub">An NVIDIA position, deliberated to consensus.</p>
    </div>
    <div class="domain">superviber.com/alignment/demo</div>`,

  // /blog and, as a fallback, individual posts.
  'blog': () => `
    <div class="brand">
      <img src="../public/images/sv-icon.png" alt="">
      <span>Superviber</span>
    </div>
    <div class="stack">
      <div class="kicker">Development Blog</div>
      <h1 class="headline">
        Technical notes on<br>
        multi-agent<br>
        <span class="accent gradient">deliberation.</span>
      </h1>
      <p class="sub">Design, implementation, and evolution of alignment dialogues.</p>
    </div>
    <div class="domain">superviber.com/blog</div>`,

  // /player — the no-track fallback; individual songs use their own artwork.
  'player': () => `
    <div class="brand">
      <img src="../public/images/sv-icon.png" alt="">
      <span>Superviber</span>
    </div>
    <div class="stack">
      <div class="kicker">Vibe Player</div>
      <h1 class="headline lg">
        Listen with<br>
        <span class="accent gradient">synchronized lyrics.</span>
      </h1>
      <p class="sub">A curated playlist you can read along to.</p>
    </div>
    <div class="domain">superviber.com/player</div>`,
};

const name = new URLSearchParams(location.search).get('v') || 'home';
const build = VARIANTS[name];
if (!build) throw new Error(`Unknown variant: ${name}`);

document.getElementById('card').innerHTML =
  '<div class="hairline"></div>' +
  '<div class="glow glow-violet"></div>' +
  '<div class="glow glow-warm"></div>' +
  '<div class="grid"></div>' +
  build();
</script>
</body>
</html>
