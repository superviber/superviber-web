<!doctype html>
<!--
  Source for public/images/og-card.png (1200x630 Open Graph card).
  Regenerate with:  node scripts/generate-og-card.mjs
  Palette mirrors .gradient-bg / .gradient-text in src/app/globals.css.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* Vendored so the render is deterministic and works offline. */
  @font-face{
    font-family:'Inter';
    src:url('assets/inter-latin.woff2') format('woff2');
    font-weight:100 900;
    font-style:normal;
    font-display:block;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html, body { width:1200px; height:630px; }

  body{
    font-family:'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background:#0a0812;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    position:relative;
    width:1200px; height:630px;
    background:linear-gradient(135deg,#0a0812 0%,#120f24 25%,#1a1233 50%,#1f0f2e 75%,#260d28 100%);
    overflow:hidden;
  }

  /* Ambient glows echoing the logo's violet + warm ends */
  .glow{ position:absolute; border-radius:50%; filter:blur(90px); }
  .glow-violet{
    width:760px; height:760px; top:-300px; right:-200px;
    background:radial-gradient(circle,rgba(167,139,250,.30) 0%,rgba(232,121,249,.12) 45%,transparent 70%);
  }
  .glow-warm{
    width:620px; height:620px; bottom:-320px; left:-160px;
    background:radial-gradient(circle,rgba(244,114,182,.20) 0%,rgba(249,115,22,.10) 45%,transparent 70%);
  }

  /* Fine grid, barely-there structure */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 40%,transparent 100%);
    -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 45%,#000 40%,transparent 100%);
  }

  .inner{
    position:relative;
    height:100%;
    display:flex; align-items:center; gap:64px;
    padding:0 86px;
  }

  .logo{
    width:268px; height:268px;
    flex-shrink:0;
    object-fit:contain;
    filter:drop-shadow(0 18px 55px rgba(139,92,246,.42));
  }

  .divider{
    width:1px; height:300px; flex-shrink:0;
    background:linear-gradient(180deg,transparent,rgba(255,255,255,.16) 22%,rgba(255,255,255,.16) 78%,transparent);
  }

  .copy{ display:flex; flex-direction:column; }

  .eyebrow{
    font-size:19px; font-weight:600;
    letter-spacing:.22em; text-transform:uppercase;
    color:#c4b5fd;
    margin-bottom:22px;
  }

  .wordmark{
    font-size:104px; font-weight:800;
    letter-spacing:-.035em; line-height:1;
    background:linear-gradient(135deg,#a78bfa 0%,#e879f9 50%,#f472b6 100%);
    -webkit-background-clip:text; background-clip:text;
    -webkit-text-fill-color:transparent; color:transparent;
    margin-bottom:26px;
  }

  .tagline{
    font-size:35px; font-weight:400; line-height:1.32;
    color:rgba(255,255,255,.80);
    max-width:600px;
    letter-spacing:-.012em;
  }

  .domain{
    position:absolute; bottom:44px; right:86px;
    font-size:21px; font-weight:500; letter-spacing:.03em;
    color:rgba(255,255,255,.42);
  }

  /* Top hairline accent */
  .hairline{
    position:absolute; top:0; left:0; right:0; height:4px;
    background:linear-gradient(90deg,#a78bfa 0%,#e879f9 38%,#f472b6 62%,#f97316 100%);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="hairline"></div>
    <div class="glow glow-violet"></div>
    <div class="glow glow-warm"></div>
    <div class="grid"></div>

    <div class="inner">
      <img class="logo" src="../public/images/sv-icon.png" alt="">
      <div class="divider"></div>
      <div class="copy">
        <div class="eyebrow">Multi-Agent Deliberation</div>
        <h1 class="wordmark">Superviber</h1>
        <p class="tagline">Coordinated intelligence<br>for complex decisions.</p>
      </div>
    </div>

    <div class="domain">superviber.com</div>
  </div>
</body>
</html>
